<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUMI — Reborn</title><link rel="stylesheet" href="/css/main.css"></head><body><div id="app">
<section id="menu" class="screen"><div class="brand"><div class="logo-orb">✦</div><div><div class="eyebrow">A LIVING MULTIPLAYER WORLD</div><h1>LUMI</h1><p>Every player leaves a memory.</p></div></div>
<div class="panel menu-panel"><label>YOUR NAME<input id="name" maxlength="18" placeholder="Lumi"></label><button id="create" class="primary">CREATE A NEW WORLD</button><div class="divider">PUBLIC WORLDS</div><div id="rooms" class="rooms"></div><div class="tiny">No database. Rooms and world state live in the active server session.</div></div></section>
<section id="game" class="hidden"><canvas id="canvas"></canvas><div class="hud"><div class="brand-mini">✦ LUMI</div><div class="objective"><span class="eyebrow">WORLD MEMORY</span><strong id="objective">Waiting for players…</strong><span id="progress">0 / 3</span></div><button id="leave" class="ghost">LEAVE</button></div><div id="toast"></div><div class="chat"><div id="messages"></div><form id="chatForm"><input id="chatInput" maxlength="160" autocomplete="off" placeholder="Say something…"><button>➤</button></form></div><div id="players" class="players"></div><div class="controls"><button data-key="u">▲</button><div><button data-key="l">◀</button><button data-key="d">▼</button><button data-key="r">▶</button></div></div><div id="startHint" class="start-hint">Move with WASD / arrows • Find glowing memories • Work together</div></section></div><script type="module" src="/js/main.js"></script></body></html>
